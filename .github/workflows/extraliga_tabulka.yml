# Automatická tabulka Extraligy pro tipovačku Mistrů světa: každé ráno stáhne aktuální pořadí, body
# a statistiky týmů do 2627_extraliga_stav.json (web i Apps Script z něj berou pořadí a průběžné odpovědi)
# a nový stav tabulky přidá do 2627_extraliga_historie.json (graf vývoje tipovačky).
# Ručně: záložka Actions → "Tabulka Extraligy" → Run workflow.
name: Tabulka Extraligy

on:
  workflow_dispatch:
    inputs:
      rezim:
        description: "aktualizace = stáhnout a uložit tabulku, sonda = jen vypsat, co zdroje vracejí"
        required: false
        default: "aktualizace"
  schedule:
    - cron: "30 4 * * *"   # každý den 6:30 (letní čas) / 5:30 (zimní čas); ručně kdykoli přes Run workflow

permissions:
  contents: write

jobs:
  tabulka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Stáhnout tabulku
        run: node skripty/stahni_tabulku_extraligy.js --rezim "${{ github.event.inputs.rezim || 'aktualizace' }}"
      - name: Uložit změnu do repa
        if: ${{ (github.event.inputs.rezim || 'aktualizace') == 'aktualizace' }}
        run: |
          if [ -z "$(git status --porcelain -- 2627_extraliga_stav.json 2627_extraliga_historie.json)" ]; then
            echo "Tabulka beze změny, není co ukládat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2627_extraliga_stav.json 2627_extraliga_historie.json
          git commit -m "Tabulka Extraligy: automatická aktualizace $(date -u +%Y-%m-%d)"
          git push
